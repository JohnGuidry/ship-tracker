# ship-tracker nginx config (reference)
#
# These blocks live in the site's nginx vhost (e.g. /etc/nginx/sites-enabled/).
# The API backend runs on the capture host (USB-John, 192.168.1.49:8080); the
# static dashboard is served from the site's web root.
#
# NOTE: the site's main deploy rsyncs with --delete; add `--exclude=ais/` so it
# does not remove the ship-tracker-deployed dashboard. ship-tracker's
# deploy/deploy-dashboard.sh owns the /ais/ path.

# AIS API — proxy to ais_api.py on the capture host
location /ais/api/ {
    proxy_pass http://192.168.1.49:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
}

# AIS static pages (live tracker + heatmap)
location /ais/ {
    root /var/www/prosite/dist;
    try_files $uri $uri/ /ais/index.html;
}

# Redirect bare /ais to /ais/
location = /ais {
    return 301 $scheme://$host/ais/;
}
